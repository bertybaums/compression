# FORM-N SFT (Phase 2) -- ARM B of the form x prompt-diversity factorial.
#
# Matched 1:1 with reasoner_ugf_n_sft.yaml (ARM A, already trained June 2 ->
# checkpoints/reasoner_ugf_n_sft/final.pt). The ONLY difference is the training
# corpus:
#   ARM A (essay): corpus/processed/ugf_n_sft_400k.jsonl  (400,000 ex)
#   ARM B (form) : corpus/processed/ugf_form_n.jsonl      (399,984 ex, gen June 9)
# Both init from checkpoints/reasoner_ugf_n_pretrain/final.pt, same vocab, same
# hyperparameters, same 30K steps. A vs B = response-form effect.
#
# READ FIRST: docs/form-retrain-clean-design-2026-06-03.md, THIRD AMENDMENT.
# Both arms carry only 380 unique prompts across ~400K examples (~1,053 repeats),
# so prompt-attention earns nothing in training loss in EITHER arm. A null here
# therefore licenses only "response form at fixed prompt diversity is not the
# fix" -- NOT the originally pre-registered "deep property of essay
# distillation". Arm C (reasoner_formdiv_n_sft.yaml) varies prompt diversity,
# which is the hypothesis the July 16 audit promotes to first place.
#
# Known caveat, report it: the form arm's word median is 263 vs the essay arm's
# 285 (-7.7%), which trips the short side of check_length_match.py. We keep the
# recipe identical to ARM A (30K steps) rather than compensating, because ARM A
# is already trained at that recipe and "identical recipe" is the design's
# control; the consequence is ARM B sees ~7.7% fewer tokens per epoch.
#
# Run:
#   sbatch slurm/train_form_n_sft.sbatch

tokenizer:
  vocab_path: wordlist/vocab_final.json   # UGF, 3,643 tokens

model:
  # MUST match the pretrain checkpoint architecture (loading those weights).
  d_model: 1024
  n_layers: 16
  n_heads: 16
  n_kv_heads: 4
  d_ff: 3072
  max_seq_len: 1024          # matched across arms
  dropout: 0.0
  tie_embeddings: true

training:
  batch_size: 8
  grad_accum_steps: 8        # effective batch = 64
  max_lr: 5.0e-5
  min_lr: 5.0e-6
  weight_decay: 0.05
  warmup_steps: 500
  max_steps: 30000           # identical to ARM A
  gradient_checkpointing: true
  use_amp: true

  log_interval: 50
  save_interval: 5000
  eval_interval: 500
  sample_probe_every_n_evals: 4
  max_checkpoints: 8         # full span (5K..30K) for best-by-val recovery

  checkpoint_dir: checkpoints/reasoner_form_n_sft
  log_dir: logs/reasoner_form_n_sft
  sample_log_dir: logs/reasoner_form_n_sft/samples

data:
  train_paths:
    - corpus/processed/ugf_form_n.jsonl
  dataset_type: sft_plain    # UGFSFTPlainDataset: reads pre-rendered prompt/response
  per_source_val: true
  random_val_fraction: 0.10  # matched to ARM A
  sample_prompts_path: eval/sets/sample_prompts.jsonl
  num_workers: 4
