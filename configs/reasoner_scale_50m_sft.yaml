# Scale study — 52M SFT (Phase 2). Init from reasoner_scale_50m_pretrain/final.pt.
# docs/scale-study-design-2026-06-03.md
# v1 SFT recipe (configs/reasoner_sft.yaml), model dims only changed.

model:
  d_model: 768
  n_layers: 8
  n_heads: 12
  n_kv_heads: 3
  d_ff: 2048
  max_seq_len: 512
  dropout: 0.0
  tie_embeddings: true

training:
  batch_size: 8
  grad_accum_steps: 8        # effective batch = 64
  max_lr: 5.0e-5
  min_lr: 5.0e-6
  weight_decay: 0.05
  warmup_steps: 500
  max_steps: 30000
  gradient_checkpointing: true
  use_amp: true

  log_interval: 50
  save_interval: 2000
  eval_interval: 500
  sample_probe_every_n_evals: 4
  max_checkpoints: 3

  checkpoint_dir: checkpoints/reasoner_scale_50m_sft
  log_dir: logs/reasoner_scale_50m_sft
  sample_log_dir: logs/reasoner_scale_50m_sft/samples

data:
  train_paths:
    - corpus/processed/ugf_reasoning.jsonl
  per_source_val: true
  sample_prompts_path: eval/sets/sample_prompts.jsonl
  dataset_type: sft           # v1 template format (UGFSFTDataset), matches the 200M anchor
  num_workers: 4
  heldout_ids_path: corpus/processed/heldout_ids.json
  random_val_fraction: 0.05
