# English-N pretrain (Phase 1) -- 200M English-vocab baseline, English arm.
# docs/english-baseline-design-2026-05-24.md
#
# Matched 1:1 with reasoner_ugf_n_pretrain.yaml: IDENTICAL transformer block and
# recipe; the ONLY difference is the vocabulary (tokenizer.vocab_path + data).
#
# Param accounting (tied embeddings):
#   transformer block (non-embedding) = 192,971,776   <- IDENTICAL across arms
#   embedding   = 40,027 x 1024       =  40,987,648
#   total                             = 233,959,424   (~234.0M)
#   [UGF arm total ~196.7M; the +37M embedding IS the variable under study]

tokenizer:
  vocab_path: wordlist/vocab_english_40k.json   # English, 40,027 tokens

model:
  d_model: 1024
  n_layers: 16
  n_heads: 16
  n_kv_heads: 4
  d_ff: 3072
  max_seq_len: 512
  dropout: 0.0
  tie_embeddings: true

training:
  batch_size: 8
  grad_accum_steps: 8        # effective batch = 64
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  warmup_steps: 1000
  max_steps: 100000          # v1 recipe; matched across arms (see UGF config note).
  gradient_checkpointing: true
  use_amp: true

  log_interval: 50
  save_interval: 10000
  eval_interval: 1000
  sample_probe_every_n_evals: 5
  max_checkpoints: 10        # keep a full span (10K..100K) for best-by-val recovery

  checkpoint_dir: checkpoints/reasoner_en_n_pretrain
  log_dir: logs/reasoner_en_n_pretrain
  sample_log_dir: logs/reasoner_en_n_pretrain/samples

data:
  # Pretrain on the flat teacher English responses over the matched prompts.
  train_paths:
    - corpus/processed/english_n.jsonl
  text_field: english_text
  dataset_type: reasoning

  per_source_val: true
  random_val_fraction: 0.10  # matched val carve (see UGF config note)

  sample_prompts_path: eval/sets/sample_prompts.jsonl
  num_workers: 4
